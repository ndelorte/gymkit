name: CI

# Minimum reproducible evidence for every push/PR: the fast, simulator-free
# domain test suite, and a clean build of the app target. UI tests
# (AppGymUITests) are intentionally NOT run here — they need a booted iOS
# Simulator, which adds real cost/flakiness to CI for marginal benefit over
# running them locally before a release. See docs/DEVELOPMENT.md for the
# command to run them by hand.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show selected Xcode version
        run: xcodebuild -version

      - name: Run AppGymKit domain tests
        run: cd AppGymKit && swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build AppGym (iOS Simulator, generic destination)
        run: |
          xcodebuild build \
            -project AppGym.xcodeproj \
            -scheme AppGym \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
