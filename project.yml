name: AppGym
options:
  bundleIdPrefix: com.ndelorte.appgym
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  AppGymKit:
    path: AppGymKit

targets:
  AppGym:
    type: application
    platform: iOS
    sources:
      - path: AppGym
    dependencies:
      - package: AppGymKit
    info:
      path: AppGym/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: AppGym
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ndelorte.appgym
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: 5.0
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  AppGymUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppGymUITests
    dependencies:
      - target: AppGym
    settings:
      base:
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: true

schemes:
  AppGym:
    build:
      targets:
        AppGym: all
        AppGymUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AppGymUITests
